apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: vitegitops-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Abd-del1/argocd-gitops-repo.git
    targetRevision: main

    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
