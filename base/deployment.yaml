apiVersion: apps/v1
kind: Deployment

metadata:
  name: vitegitops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vitegitops

  template:
    metadata:
      labels:
        app: vitegitops

    spec:
      containers:
      - name: vitegitops

        image: abdullah7434/vite-gitops-app:latest

        ports:
        - containerPort: 80
